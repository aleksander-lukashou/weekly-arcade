<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Arcade</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; padding:2rem 1rem; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:1.8rem; letter-spacing:.04em; }
  h1 span { color:var(--accent); }
  p.tag { color:var(--dim); margin:.4rem 0 2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
  a.card { display:block; background:var(--card); border:1px solid #21262d; border-radius:10px; padding:1rem; text-decoration:none; color:inherit; transition:border-color .15s; }
  a.card:hover { border-color:var(--accent); }
  .card h2 { font-size:1.05rem; margin-bottom:.35rem; }
  .card .date { color:var(--accent); font-size:.75rem; }
  .card .headline { color:var(--dim); font-size:.8rem; margin-top:.5rem; line-height:1.4; }
  .empty { color:var(--dim); border:1px dashed #21262d; border-radius:10px; padding:2rem; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>WEEKLY <span>ARCADE</span></h1>
  <p class="tag">one tiny game a week, ripped from the headlines, built by a robot</p>
  <div class="grid" id="grid"><div class="empty">loading…</div></div>
</main>
<script>
fetch("games/manifest.json")
  .then(r => r.json())
  .then(({games}) => {
    const grid = document.getElementById("grid");
    if (!games || games.length === 0) {
      grid.innerHTML = '<div class="empty">no games yet — the robot ships its first one this week</div>';
      return;
    }
    grid.innerHTML = "";
    [...games].sort((a, b) => b.date.localeCompare(a.date)).forEach(g => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.path;
      a.innerHTML = '<div class="date"></div><h2></h2><div class="headline"></div>';
      a.querySelector(".date").textContent = g.date;
      a.querySelector("h2").textContent = g.title;
      a.querySelector(".headline").textContent = "inspired by: " + g.headline;
      grid.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById("grid").innerHTML = '<div class="empty">could not load the game list</div>';
  });
</script>
</body>
</html>
