name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest and games
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("games/manifest.json", "utf8"));
            if (!Array.isArray(m.games)) throw new Error("manifest.games must be an array");
            for (const g of m.games) {
              for (const k of ["slug", "title", "date", "headline", "path"])
                if (!g[k]) throw new Error(`manifest entry missing ${k}: ${JSON.stringify(g)}`);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(g.date)) throw new Error(`bad date ${g.date}`);
              if (!fs.existsSync(g.path + "/index.html") && !fs.existsSync(g.path + "index.html"))
                throw new Error(`no index.html under ${g.path}`);
            }
            console.log(`manifest OK — ${m.games.length} game(s)`);
          '
          # Syntax-check every game script (vendored lib excluded).
          find games -name "*.js" -print0 | while IFS= read -r -d "" f; do
            node --check "$f"
            echo "syntax OK: $f"
          done
